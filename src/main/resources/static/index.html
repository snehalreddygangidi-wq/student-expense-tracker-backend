<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Expense Tracker</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">

<div class="auth-container">
    <div class="brand">
        <div class="logo">₹</div>
        <h1>Student Expense Tracker</h1>
        <p>Track your money. Understand your spending.</p>
    </div>

    <div class="card">
        <div class="tabs">
            <button id="loginTab" class="tab active">Login</button>
            <button id="registerTab" class="tab">Create Account</button>
        </div>

        <form id="loginForm">
            <h2>Welcome Back</h2>
            <p class="muted">Login to manage your expenses.</p>

            <label>Email</label>
            <input id="loginEmail" type="email" placeholder="student@example.com" required>

            <label>Password</label>
            <input id="loginPassword" type="password" placeholder="Enter password" required>

            <button class="primary-btn" type="submit">Login</button>
            <p id="loginMessage" class="message"></p>
        </form>

        <form id="registerForm" class="hidden">
            <h2>Create Account</h2>
            <p class="muted">Start tracking your student expenses.</p>

            <label>Name</label>
            <input id="registerName" type="text" placeholder="Your name" required>

            <label>Email</label>
            <input id="registerEmail" type="email" placeholder="student@example.com" required>

            <label>Password</label>
            <input id="registerPassword" type="password" placeholder="Minimum 6 characters" required>

            <button class="primary-btn" type="submit">Create Account</button>
            <p id="registerMessage" class="message"></p>
        </form>
    </div>
</div>

<script src="/js/auth.js"></script>
</body>
</html>
