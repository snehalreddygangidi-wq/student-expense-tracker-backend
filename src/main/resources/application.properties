spring.application.name=student-expense-tracker

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/student_expense_tracker?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# JWT authentication
app.jwt.secret=StudentExpenseTrackerJwtSecretKey2026MustBeAtLeast32CharsLong!
app.jwt.expiration=86400000
